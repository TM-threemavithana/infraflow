# Configuration for actionlint in InfraFlow
# https://github.com/rhysd/actionlint/tree/v1.7.7/docs/config.md

paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # job.workflow_repository and job.workflow_sha are official GitHub Actions context properties for reusable workflows
      # not yet recognized by actionlint v1.7.7 schema
      - 'property "workflow_repository" is not defined in object type'
      - 'property "workflow_sha" is not defined in object type'
