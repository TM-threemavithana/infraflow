name: "InfraFlow Reusable Protected Apply Simulation & Authorization Gate"

on:
  workflow_call:
    inputs:
      plan-id:
        description: "Unique plan identifier tracked in the offline replay ledger"
        required: true
        type: string
      plan-envelope-file:
        description: "Relative path to encrypted plan envelope JSON (e.g. plan.enc.json)"
        required: true
        type: string
      state-file:
        description: "Relative path to current Terraform state snapshot JSON (e.g. terraform.tfstate)"
        required: true
        type: string
      environment:
        description: "Target deployment environment context (e.g. staging, production)"
        required: false
        default: "production"
        type: string
      expected-lineage:
        description: "Expected Terraform state lineage UUID matching planning metadata"
        required: true
        type: string
      expected-serial:
        description: "Expected Terraform state serial integer matching planning metadata"
        required: true
        type: number
      expected-backend:
        description: "Expected backend identity URL or target (e.g. s3://bucket/key)"
        required: false
        default: ""
        type: string
      expected-workspace:
        description: "Expected Terraform workspace name (default 'default')"
        required: false
        default: "default"
        type: string
      provenance-file:
        description: "Optional relative path to in-toto DSSE provenance attestation JSON"
        required: false
        default: ""
        type: string
      require-production-provenance:
        description: "Whether to require verified production signing provenance (default true)"
        required: false
        default: true
        type: boolean
      ledger-db-path:
        description: "Relative path to offline SQLite replay ledger database"
        required: false
        default: ".infraflow/replay_ledger.db"
        type: string
      allow-initial-state:
        description: "Whether to permit initial bootstrap state (serial 0, empty state)"
        required: false
        default: false
        type: boolean
      max-ttl-seconds:
        description: "Maximum allowable plan age in seconds (default 43200 = 12h)"
        required: false
        default: 43200
        type: number
      clock-skew-seconds:
        description: "Clock skew tolerance in seconds (default 60s)"
        required: false
        default: 60
        type: number
      destruction-policy-file:
        description: "Optional relative path to trusted JSON destruction blast-radius policy"
        required: false
        default: ""
        type: string
      destruction-confirmation-file:
        description: "Optional relative path to plan-specific destruction confirmation contract JSON"
        required: false
        default: ""
        type: string
      destruction-confirmation-token:
        description: "Optional inline JSON destruction confirmation contract string"
        required: false
        default: ""
        type: string
      max-deletions:
        description: "Optional caller-specified maximum deletions limit (cannot exceed policy)"
        required: false
        default: -1
        type: number
      max-replacements:
        description: "Optional caller-specified maximum replacements limit (cannot exceed policy)"
        required: false
        default: -1
        type: number
      plan-json-file:
        description: "Optional relative path to unencrypted plan JSON for destructive change analysis"
        required: false
        default: ""
        type: string
      trusted-authorizers:
        description: "Optional comma-separated allowlist of trusted destruction authorizers"
        required: false
        default: ""
        type: string

    outputs:
      plan-verification-status:
        description: "Outcome of plan envelope static and cryptographic checks (success, failure, skipped)"
        value: ${{ jobs.summary.outputs.plan-verification-status }}
      provenance-status:
        description: "Outcome of in-toto provenance attestation verification (verified, unverified, skipped)"
        value: ${{ jobs.summary.outputs.provenance-status }}
      state-consistency-status:
        description: "Outcome of state lineage, serial, and workspace verification (success, failure, skipped)"
        value: ${{ jobs.summary.outputs.state-consistency-status }}
      replay-status:
        description: "Outcome of replay ledger atomic reservation (reserved, duplicate, consumed, failed)"
        value: ${{ jobs.summary.outputs.replay-status }}
      destruction-status:
        description: "Outcome of destructive change assessment (safe, authorized, rejected, not-applicable)"
        value: ${{ jobs.summary.outputs.destruction-status }}
      destruction-summary:
        description: "JSON summary of deletions, replacements, and affected resources"
        value: ${{ jobs.summary.outputs.destruction-summary }}
      authorization-status:
        description: "Final pre-execution authorization outcome (AUTHORIZED_FOR_SIMULATION, REJECTED)"
        value: ${{ jobs.summary.outputs.authorization-status }}
      simulation-status:
        description: "Execution mode status (simulated-only)"
        value: ${{ jobs.summary.outputs.simulation-status }}

permissions:
  contents: read

jobs:
  validate-inputs:
    name: "Validate & Guard Apply Simulation Inputs"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - name: "Security Guard: Sanitize Inputs & Verify Trust Boundaries"
        id: guard
        env:
          INPUT_PLAN_ID: ${{ inputs.plan-id }}
          INPUT_ENVELOPE_FILE: ${{ inputs.plan-envelope-file }}
          INPUT_STATE_FILE: ${{ inputs.state-file }}
          INPUT_ENV: ${{ inputs.environment }}
          INPUT_LINEAGE: ${{ inputs.expected-lineage }}
          INPUT_SERIAL: ${{ inputs.expected-serial }}
          INPUT_BACKEND: ${{ inputs.expected-backend }}
          INPUT_WORKSPACE: ${{ inputs.expected-workspace }}
          INPUT_PROVENANCE_FILE: ${{ inputs.provenance-file }}
          INPUT_LEDGER_PATH: ${{ inputs.ledger-db-path }}
          INPUT_DESTRUCTION_POLICY: ${{ inputs.destruction-policy-file }}
          INPUT_DESTRUCTION_CONF_FILE: ${{ inputs.destruction-confirmation-file }}
          INPUT_DESTRUCTION_CONF_TOKEN: ${{ inputs.destruction-confirmation-token }}
          INPUT_MAX_DELETIONS: ${{ inputs.max-deletions }}
          INPUT_MAX_REPLACEMENTS: ${{ inputs.max-replacements }}
          INPUT_PLAN_JSON: ${{ inputs.plan-json-file }}
          INPUT_TRUSTED_AUTHORIZERS: ${{ inputs.trusted-authorizers }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_REF: ${{ github.ref }}
          WORKFLOW_REPO: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          set -euo pipefail
          echo "::group::Apply Simulation Input Sanitization & Trust Boundary Validation"

          # 1. Enforce Event Authorization (SEC-02 Fail-Closed)
          if [[ "${EVENT_NAME}" == "pull_request" || "${EVENT_NAME}" == "pull_request_target" ]]; then
            echo "::error::Security Violation: Untrusted pull requests (${EVENT_NAME}) are strictly prohibited from requesting execution or apply authorization."
            exit 1
          fi

          if [[ "${EVENT_NAME}" != "push" && "${EVENT_NAME}" != "workflow_dispatch" && "${EVENT_NAME}" != "release" ]]; then
            echo "::error::Security Violation: Event '${EVENT_NAME}' is unauthorized for apply workflow execution."
            exit 1
          fi

          # 2. Enforce Protected Branch or Release Tag Target
          if [[ ! "${TARGET_REF}" =~ ^refs/heads/(main|master|release/.*)$ ]] && [[ ! "${TARGET_REF}" =~ ^refs/tags/v.* ]]; then
            echo "::error::Security Violation: Apply simulation can only be executed from protected branches (main, master, release/*) or release tags (v*). Target ref '${TARGET_REF}' is an arbitrary, unprotected branch."
            exit 1
          fi

          # 3. Validate Plan ID
          if [[ -z "${INPUT_PLAN_ID}" ]] || [[ ! "${INPUT_PLAN_ID}" =~ ^[a-zA-Z0-9_.-]+$ ]]; then
            echo "::error::Security Violation: Invalid or missing plan-id '${INPUT_PLAN_ID}'. Must be alphanumeric with [-_.] allowed."
            exit 1
          fi

          # 4. Path traversal and symlink prevention for file paths
          for file_var in "${INPUT_ENVELOPE_FILE}" "${INPUT_STATE_FILE}" "${INPUT_LEDGER_PATH}"; do
            if [[ -z "${file_var}" ]]; then
              echo "::error::Security Violation: Required file path is empty."
              exit 1
            fi
            if [[ "${file_var}" =~ ^/ ]] || [[ "${file_var}" =~ ^~ ]] || [[ "${file_var}" =~ \.\. ]]; then
              echo "::error::Security Violation: Path traversal or absolute paths prohibited in file path: '${file_var}'."
              exit 1
            fi
            if [[ ! "${file_var}" =~ ^[a-zA-Z0-9_./-]+$ ]]; then
              echo "::error::Security Violation: File path contains forbidden characters: '${file_var}'."
              exit 1
            fi
            if [[ -L "${file_var}" ]]; then
              echo "::error::Security Violation: Symbolic links are strictly prohibited: '${file_var}'."
              exit 1
            fi
          done

          # 5. Validate optional provenance file path if specified
          if [[ -n "${INPUT_PROVENANCE_FILE}" ]]; then
            if [[ "${INPUT_PROVENANCE_FILE}" =~ ^/ ]] || [[ "${INPUT_PROVENANCE_FILE}" =~ ^~ ]] || [[ "${INPUT_PROVENANCE_FILE}" =~ \.\. ]]; then
              echo "::error::Security Violation: Path traversal or absolute paths prohibited in provenance-file: '${INPUT_PROVENANCE_FILE}'."
              exit 1
            fi
            if [[ ! "${INPUT_PROVENANCE_FILE}" =~ ^[a-zA-Z0-9_./-]+$ ]]; then
              echo "::error::Security Violation: provenance-file contains forbidden characters: '${INPUT_PROVENANCE_FILE}'."
              exit 1
            fi
            if [[ -L "${INPUT_PROVENANCE_FILE}" ]]; then
              echo "::error::Security Violation: Symbolic links are strictly prohibited: '${INPUT_PROVENANCE_FILE}'."
              exit 1
            fi
          fi

          # 6. Validate Environment Name
          if [[ ! "${INPUT_ENV}" =~ ^[a-zA-Z0-9_.-]+$ ]]; then
            echo "::error::Security Violation: environment name contains invalid characters: '${INPUT_ENV}'."
            exit 1
          fi

          # 7. Validate Lineage format (UUID regex or valid lineage identifier)
          if [[ ! "${INPUT_LINEAGE}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] && \
             [[ ! "${INPUT_LINEAGE}" =~ ^[a-zA-Z0-9_.-]+$ ]]; then
            echo "::error::Security Violation: Invalid state lineage format: '${INPUT_LINEAGE}'."
            exit 1
          fi

          # 8. Validate Serial format (non-negative integer)
          if [[ ! "${INPUT_SERIAL}" =~ ^[0-9]+$ ]]; then
            echo "::error::Security Violation: State serial must be a non-negative integer: '${INPUT_SERIAL}'."
            exit 1
          fi

          # 9. Validate Workspace
          if [[ ! "${INPUT_WORKSPACE}" =~ ^[a-zA-Z0-9_.-]+$ ]]; then
            echo "::error::Security Violation: Workspace contains invalid characters: '${INPUT_WORKSPACE}'."
            exit 1
          fi

          # 10. Platform Trust Boundary Validation
          TRUSTED_PLATFORM_REPO="TM-threemavithana/infraflow"
          EXPECTED_WORKFLOW_PATH=".github/workflows/reusable-tf-apply.yml"

          if [[ "${WORKFLOW_REPO}" != "${TRUSTED_PLATFORM_REPO}" ]]; then
            echo "::error::Security Violation: Platform workflow repository '${WORKFLOW_REPO}' is not the trusted InfraFlow platform. Only '${TRUSTED_PLATFORM_REPO}' is authorized to execute this workflow."
            exit 1
          fi

          if [[ "${WORKFLOW_REF}" != *"@"* ]]; then
            echo "::error::Security Violation: workflow_ref '${WORKFLOW_REF}' is missing the '@<ref>' delimiter."
            exit 1
          fi

          WORKFLOW_REF_PREFIX="${WORKFLOW_REF%@*}"
          WORKFLOW_REF_TARGET="${WORKFLOW_REF##*@}"
          EXPECTED_PREFIX="${TRUSTED_PLATFORM_REPO}/${EXPECTED_WORKFLOW_PATH}"

          if [[ "${WORKFLOW_REF_PREFIX}" != "${EXPECTED_PREFIX}" ]]; then
            echo "::error::Security Violation: Platform workflow ref prefix '${WORKFLOW_REF_PREFIX}' does not match expected '${EXPECTED_PREFIX}'."
            exit 1
          fi

          # Strictly reject mutable branch or tag references (@main, @master, @v0.*)
          if [[ ! "${WORKFLOW_REF_TARGET}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Security Violation: Platform reusable workflow must be referenced by an immutable 40-character commit SHA. Found mutable ref '${WORKFLOW_REF_TARGET}'."
            exit 1
          fi

          if [[ "${WORKFLOW_REF_TARGET}" != "${WORKFLOW_SHA}" ]]; then
            echo "::error::Security Violation: Workflow ref SHA '${WORKFLOW_REF_TARGET}' does not match immutable job SHA '${WORKFLOW_SHA}'."
            exit 1
          fi

          # 11. Validate Destruction Blast-Radius & Confirmation Inputs
          for opt_file in "${INPUT_DESTRUCTION_POLICY}" "${INPUT_DESTRUCTION_CONF_FILE}" "${INPUT_PLAN_JSON}"; do
            if [[ -n "${opt_file}" ]]; then
              if [[ "${opt_file}" =~ ^/ ]] || [[ "${opt_file}" =~ ^~ ]] || [[ "${opt_file}" =~ \.\. ]]; then
                echo "::error::Security Violation: Path traversal or absolute paths prohibited in file path: '${opt_file}'."
                exit 1
              fi
              if [[ ! "${opt_file}" =~ ^[a-zA-Z0-9_./-]+$ ]]; then
                echo "::error::Security Violation: File path contains forbidden characters: '${opt_file}'."
                exit 1
              fi
              if [[ -L "${opt_file}" ]]; then
                echo "::error::Security Violation: Symbolic links are strictly prohibited: '${opt_file}'."
                exit 1
              fi
            fi
          done

          # Check destruction limits format
          for limit_val in "${INPUT_MAX_DELETIONS}" "${INPUT_MAX_REPLACEMENTS}"; do
            if [[ -n "${limit_val}" && ! "${limit_val}" =~ ^-?[0-9]+$ ]]; then
              echo "::error::Security Violation: Destruction limits must be valid integers."
              exit 1
            fi
          done

          # Check destruction confirmation token for generic blocklist
          if [[ -n "${INPUT_DESTRUCTION_CONF_TOKEN}" ]]; then
            TRIMMED_TOKEN="$(echo "${INPUT_DESTRUCTION_CONF_TOKEN}" | tr '[:upper:]' '[:lower:]' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [[ "${TRIMMED_TOKEN}" =~ ^(yes|y|true|1|destroy|apply|confirm|confirmed|approved|ok|proceed|force|override|default)$ ]]; then
              echo "::error::Security Violation: Generic confirmation token '${TRIMMED_TOKEN}' is strictly prohibited. Requires structured JSON confirmation contract bound to plan digest."
              exit 1
            fi
          fi

          # 12. Validate trusted authorizers format if specified
          if [[ -n "${INPUT_TRUSTED_AUTHORIZERS:-}" && ! "${INPUT_TRUSTED_AUTHORIZERS}" =~ ^[a-zA-Z0-9_,.-]+$ ]]; then
            echo "::error::Security Violation: trusted-authorizers contains forbidden characters: '${INPUT_TRUSTED_AUTHORIZERS}'."
            exit 1
          fi

          echo "Input sanitization and trust boundary checks passed successfully."
          echo "::endgroup::"

  verify-plan:
    name: "Pre-Execution Verification & Replay Gate"
    needs: [validate-inputs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    outputs:
      plan-verification-status: ${{ steps.lifecycle.outputs.plan-verification-status }}
      provenance-status: ${{ steps.lifecycle.outputs.provenance-status }}
      state-consistency-status: ${{ steps.lifecycle.outputs.state-consistency-status }}
      replay-status: ${{ steps.lifecycle.outputs.replay-status }}
      destruction-status: ${{ steps.lifecycle.outputs.destruction-status }}
      destruction-summary: ${{ steps.lifecycle.outputs.destruction-summary }}
      authorization-status: ${{ steps.lifecycle.outputs.authorization-status }}
      plan-digest: ${{ steps.lifecycle.outputs.plan-digest }}

    steps:
      - name: "Checkout Calling Repository (Artifacts)"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: "Checkout Platform Toolchain (Immutable Platform Commit)"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: ".infraflow-platform"
          persist-credentials: false

      - name: "Setup Python Environment"
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: "Execute Pre-Execution Authorization Verifier"
        id: lifecycle
        env:
          PLAN_ID: ${{ inputs.plan-id }}
          ENVELOPE_FILE: ${{ inputs.plan-envelope-file }}
          STATE_FILE: ${{ inputs.state-file }}
          TARGET_ENV: ${{ inputs.environment }}
          EXPECTED_LINEAGE: ${{ inputs.expected-lineage }}
          EXPECTED_SERIAL: ${{ inputs.expected-serial }}
          EXPECTED_BACKEND: ${{ inputs.expected-backend }}
          EXPECTED_WORKSPACE: ${{ inputs.expected-workspace }}
          PROVENANCE_FILE: ${{ inputs.provenance-file }}
          REQUIRE_PROD_PROV: ${{ inputs.require-production-provenance }}
          LEDGER_PATH: ${{ inputs.ledger-db-path }}
          ALLOW_INITIAL_STATE: ${{ inputs.allow-initial-state }}
          MAX_TTL: ${{ inputs.max-ttl-seconds }}
          CLOCK_SKEW: ${{ inputs.clock-skew-seconds }}
          DESTRUCTION_POLICY: ${{ inputs.destruction-policy-file }}
          DESTRUCTION_CONF_FILE: ${{ inputs.destruction-confirmation-file }}
          DESTRUCTION_CONF_TOKEN: ${{ inputs.destruction-confirmation-token }}
          MAX_DELETIONS: ${{ inputs.max-deletions }}
          MAX_REPLACEMENTS: ${{ inputs.max-replacements }}
          PLAN_JSON_FILE: ${{ inputs.plan-json-file }}
          TRUSTED_AUTHORIZERS: ${{ inputs.trusted-authorizers }}
          REPO_NAME: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          echo "::group::Pre-Execution Verification Pipeline"

          ASSESS_OUT_JSON="assess_decision.json"
          trap 'rm -f "${ASSESS_OUT_JSON}"' EXIT INT TERM

          # 1. Verify existence of required files
          if [[ ! -f "${ENVELOPE_FILE}" ]]; then
            echo "::error::Missing required plan envelope file: '${ENVELOPE_FILE}'"
            {
              echo "plan-verification-status=failure"
              echo "authorization-status=REJECTED"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [[ ! -f "${STATE_FILE}" ]]; then
            echo "::error::Missing required state snapshot file: '${STATE_FILE}'"
            {
              echo "state-consistency-status=failure"
              echo "authorization-status=REJECTED"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Resolve active plan JSON if provided
          ACTIVE_PLAN_JSON=""
          if [[ -n "${PLAN_JSON_FILE}" && -f "${PLAN_JSON_FILE}" ]]; then
            ACTIVE_PLAN_JSON="${PLAN_JSON_FILE}"
          elif [[ -f "plan.json" ]]; then
            ACTIVE_PLAN_JSON="plan.json"
          fi

          # 2. Cryptographic Provenance Verification (In-toto DSSE)
          PROV_STATUS="UNVERIFIED"
          INTEGRITY_PY=".infraflow-platform/scripts/verify-plan-integrity.py"
          if [[ -n "${PROVENANCE_FILE}" ]]; then
            if [[ ! -f "${PROVENANCE_FILE}" ]]; then
              echo "::error::Specified provenance file does not exist: '${PROVENANCE_FILE}'"
              PROV_STATUS="UNVERIFIED"
            else
              echo "Evaluating provenance attestation cryptographically: ${PROVENANCE_FILE}"
              PROV_ARGS=(
                "verify-provenance"
                "--provenance" "${PROVENANCE_FILE}"
                "--expected-repository" "${REPO_NAME}"
                "--expected-commit-sha" "${COMMIT_SHA}"
              )
              if [[ -f ".infraflow-platform/config/trusted-plan-signing-key.pem" ]]; then
                PROV_ARGS+=("--trusted-public-key" ".infraflow-platform/config/trusted-plan-signing-key.pem")
              elif [[ -f "policies/trust/trusted_signer.pub" ]]; then
                PROV_ARGS+=("--trusted-public-key" "policies/trust/trusted_signer.pub")
              fi
              if [[ -n "${ACTIVE_PLAN_JSON}" && -f "${ACTIVE_PLAN_JSON}" ]]; then
                PROV_ARGS+=("--plan-json" "${ACTIVE_PLAN_JSON}")
              fi
              if [[ "${REQUIRE_PROD_PROV}" == "true" ]]; then
                PROV_ARGS+=("--require-production-signer")
              fi

              if python3 "${INTEGRITY_PY}" "${PROV_ARGS[@]}"; then
                echo "Cryptographic provenance attestation verified successfully."
                PROV_STATUS="VERIFIED"
              else
                echo "::error::Cryptographic provenance verification failed."
                PROV_STATUS="UNVERIFIED"
              fi
            fi
          elif [[ "${REQUIRE_PROD_PROV}" == "false" ]]; then
            echo "Production provenance requirement waived for non-production environment."
            PROV_STATUS="VERIFIED"
          else
            echo "::error::Verified provenance attestation is required for environment '${TARGET_ENV}'."
            PROV_STATUS="UNVERIFIED"
          fi

          # 3. Ensure parent directory for replay ledger exists
          mkdir -p "$(dirname "${LEDGER_PATH}")"

          # 4. Construct Verifier Arguments
          VERIFY_ARGS=(
            "--envelope-file" "${ENVELOPE_FILE}"
            "--state-file" "${STATE_FILE}"
            "--expected-repo" "${REPO_NAME}"
            "--expected-commit" "${COMMIT_SHA}"
            "--expected-environment" "${TARGET_ENV}"
            "--expected-lineage" "${EXPECTED_LINEAGE}"
            "--expected-serial" "${EXPECTED_SERIAL}"
            "--expected-workflow-sha" "${WORKFLOW_SHA}"
            "--expected-workspace" "${EXPECTED_WORKSPACE}"
            "--actual-workspace" "${EXPECTED_WORKSPACE}"
            "--ledger-db" "${LEDGER_PATH}"
            "--provenance-status" "${PROV_STATUS}"
          )

          if [[ -n "${EXPECTED_BACKEND}" ]]; then
            VERIFY_ARGS+=("--expected-backend" "${EXPECTED_BACKEND}" "--actual-backend" "${EXPECTED_BACKEND}")
          fi

          if [[ "${ALLOW_INITIAL_STATE}" == "true" ]]; then
            VERIFY_ARGS+=("--initial-state")
          fi

          # 5. Execute python verifier
          VERIFIER_PY=".infraflow-platform/scripts/verify-plan-lifecycle.py"
          echo "Executing: python3 ${VERIFIER_PY} verify ..."
          
          VERIFY_OUTPUT=$(python3 "${VERIFIER_PY}" verify "${VERIFY_ARGS[@]}" 2>&1 || true)
          echo "${VERIFY_OUTPUT}"

          DECISION=$(echo "${VERIFY_OUTPUT}" | jq -r '.decision // "REJECTED"')
          DECISION_CODE=$(echo "${VERIFY_OUTPUT}" | jq -r '.decision_code // "UNKNOWN"')
          PLAN_DIGEST=$(echo "${VERIFY_OUTPUT}" | jq -r '.contract.plan_digest_sha256 // ""')
          REPLAY_STATUS=$(echo "${VERIFY_OUTPUT}" | jq -r '.contract.replay_status // "failed"')

          # 6. Destructive Change Assessment & Blast-Radius Evaluation (Milestone G06.4)
          DESTRUCT_STATUS="not-applicable"
          DESTRUCT_SUMMARY="{}"

          if [[ -n "${ACTIVE_PLAN_JSON}" ]]; then
            echo "Assessing plan for destructive changes using: ${ACTIVE_PLAN_JSON}"
            ASSESS_PY=".infraflow-platform/scripts/assess-destruction.py"
            ASSESS_ARGS=(
              "assess"
              "--plan-file" "${ACTIVE_PLAN_JSON}"
              "--expected-plan-id" "${PLAN_ID}"
              "--expected-digest" "${PLAN_DIGEST}"
              "--expected-repo" "${REPO_NAME}"
              "--environment" "${TARGET_ENV}"
              "--output-json" "${ASSESS_OUT_JSON}"
            )

            if [[ -n "${DESTRUCTION_POLICY}" && -f "${DESTRUCTION_POLICY}" ]]; then
              ASSESS_ARGS+=("--policy-file" "${DESTRUCTION_POLICY}")
            fi

            if [[ -n "${DESTRUCTION_CONF_FILE}" && -f "${DESTRUCTION_CONF_FILE}" ]]; then
              ASSESS_ARGS+=("--confirmation-file" "${DESTRUCTION_CONF_FILE}")
            elif [[ -n "${DESTRUCTION_CONF_TOKEN}" ]]; then
              ASSESS_ARGS+=("--confirmation-token" "${DESTRUCTION_CONF_TOKEN}")
            fi

            if [[ "${MAX_DELETIONS}" -ge 0 ]]; then
              ASSESS_ARGS+=("--max-deletions" "${MAX_DELETIONS}")
            fi

            if [[ "${MAX_REPLACEMENTS}" -ge 0 ]]; then
              ASSESS_ARGS+=("--max-replacements" "${MAX_REPLACEMENTS}")
            fi

            if [[ -n "${TRUSTED_AUTHORIZERS:-}" ]]; then
              ASSESS_ARGS+=("--trusted-authorizers" "${TRUSTED_AUTHORIZERS}")
            fi

            echo "Executing: python3 ${ASSESS_PY} ${ASSESS_ARGS[*]}"
            python3 "${ASSESS_PY}" "${ASSESS_ARGS[@]}" || true

            if [[ -f "${ASSESS_OUT_JSON}" ]]; then
              ASSESS_DECISION=$(jq -r '.decision // "REJECTED"' "${ASSESS_OUT_JSON}")
              ASSESS_CODE=$(jq -r '.decision_code // "UNKNOWN"' "${ASSESS_OUT_JSON}")
              HAS_DESTRUCTIVE=$(jq -r '.has_destructive_changes // false' "${ASSESS_OUT_JSON}")
              DESTRUCT_SUMMARY=$(jq -c '.metrics // {}' "${ASSESS_OUT_JSON}")
              rm -f "${ASSESS_OUT_JSON}"

              if [[ "${ASSESS_DECISION}" == "AUTHORIZED_FOR_SIMULATION" ]]; then
                if [[ "${HAS_DESTRUCTIVE}" == "true" ]]; then
                  DESTRUCT_STATUS="authorized"
                else
                  DESTRUCT_STATUS="safe"
                fi
                echo "Destruction assessment passed: ${DESTRUCT_STATUS}"
              else
                DESTRUCT_STATUS="rejected"
                echo "::error::Destruction assessment rejected: ${ASSESS_CODE}"
                DECISION="REJECTED"
                DECISION_CODE="DESTRUCTION_ASSESSMENT_REJECTED_${ASSESS_CODE}"
              fi
            else
              DESTRUCT_STATUS="rejected"
              echo "::error::Destruction assessment failed to generate decision output."
              DECISION="REJECTED"
              DECISION_CODE="DESTRUCTION_ASSESSMENT_FAILED"
            fi
          elif [[ -n "${DESTRUCTION_POLICY}" || -n "${DESTRUCTION_CONF_FILE}" || -n "${DESTRUCTION_CONF_TOKEN}" ]]; then
            echo "::error::Destruction policy or confirmation was supplied, but plan JSON file was not found."
            DESTRUCT_STATUS="rejected"
            DECISION="REJECTED"
            DECISION_CODE="MISSING_PLAN_JSON"
          fi

          if [[ "${DECISION}" == "AUTHORIZED_FOR_SIMULATION" ]]; then
            {
              echo "plan-verification-status=success"
              echo "provenance-status=${PROV_STATUS}"
              echo "state-consistency-status=success"
              echo "replay-status=${REPLAY_STATUS}"
              echo "destruction-status=${DESTRUCT_STATUS}"
              echo "destruction-summary=${DESTRUCT_SUMMARY}"
              echo "authorization-status=AUTHORIZED_FOR_SIMULATION"
              echo "plan-digest=${PLAN_DIGEST}"
            } >> "$GITHUB_OUTPUT"
            echo "Pre-execution verification succeeded: AUTHORIZED_FOR_SIMULATION"
          else
            {
              echo "plan-verification-status=failure"
              echo "provenance-status=${PROV_STATUS}"
              echo "state-consistency-status=failure"
              echo "replay-status=failed"
              echo "destruction-status=${DESTRUCT_STATUS}"
              echo "destruction-summary=${DESTRUCT_SUMMARY}"
              echo "authorization-status=REJECTED"
              echo "plan-digest="
            } >> "$GITHUB_OUTPUT"
            echo "::error::Pre-execution authorization rejected: ${DECISION_CODE}"
            exit 1
          fi
          echo "::endgroup::"

  summary:
    name: "Apply Simulation Audit Summary & Gate Outcome"
    needs: [validate-inputs, verify-plan]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      plan-verification-status: ${{ steps.eval.outputs.plan-verification-status }}
      provenance-status: ${{ steps.eval.outputs.provenance-status }}
      state-consistency-status: ${{ steps.eval.outputs.state-consistency-status }}
      replay-status: ${{ steps.eval.outputs.replay-status }}
      destruction-status: ${{ steps.eval.outputs.destruction-status }}
      destruction-summary: ${{ steps.eval.outputs.destruction-summary }}
      authorization-status: ${{ steps.eval.outputs.authorization-status }}
      simulation-status: "simulated-only"

    steps:
      - name: "Evaluate Final Simulation Authorization"
        id: eval
        env:
          GUARD_RESULT: ${{ needs.validate-inputs.result }}
          VERIFY_RESULT: ${{ needs.verify-plan.result }}
          PLAN_VERIFY_STATUS: ${{ needs.verify-plan.outputs.plan-verification-status }}
          PROV_STATUS: ${{ needs.verify-plan.outputs.provenance-status }}
          STATE_STATUS: ${{ needs.verify-plan.outputs.state-consistency-status }}
          REPLAY_STATUS: ${{ needs.verify-plan.outputs.replay-status }}
          DESTRUCT_STATUS: ${{ needs.verify-plan.outputs.destruction-status }}
          DESTRUCT_SUMMARY: ${{ needs.verify-plan.outputs.destruction-summary }}
          AUTH_STATUS: ${{ needs.verify-plan.outputs.authorization-status }}
          PLAN_DIGEST: ${{ needs.verify-plan.outputs.plan-digest }}
          PLAN_ID: ${{ inputs.plan-id }}
          TARGET_ENV: ${{ inputs.environment }}
          TARGET_LINEAGE: ${{ inputs.expected-lineage }}
          TARGET_SERIAL: ${{ inputs.expected-serial }}
        run: |
          set -euo pipefail

          # Fail-Closed Evaluation: Both prerequisite jobs must have succeeded and destruction assessment passed
          FINAL_AUTH="REJECTED"
          FINAL_SIMULATION="simulated-only"

          if [[ "${GUARD_RESULT}" == "success" && "${VERIFY_RESULT}" == "success" && "${AUTH_STATUS}" == "AUTHORIZED_FOR_SIMULATION" && ( "${DESTRUCT_STATUS}" == "authorized" || "${DESTRUCT_STATUS}" == "safe" || "${DESTRUCT_STATUS}" == "not-applicable" ) ]]; then
            FINAL_AUTH="AUTHORIZED_FOR_SIMULATION"
          else
            FINAL_AUTH="REJECTED"
          fi

          {
            echo "plan-verification-status=${PLAN_VERIFY_STATUS:-failure}"
            echo "provenance-status=${PROV_STATUS:-unverified}"
            echo "state-consistency-status=${STATE_STATUS:-failure}"
            echo "replay-status=${REPLAY_STATUS:-failed}"
            echo "destruction-status=${DESTRUCT_STATUS:-not-applicable}"
            echo "destruction-summary=${DESTRUCT_SUMMARY:-{}}"
            echo "authorization-status=${FINAL_AUTH}"
            echo "simulation-status=${FINAL_SIMULATION}"
          } >> "$GITHUB_OUTPUT"

          # Render GitHub Step Summary
          {
            echo "## 🛡️ InfraFlow Protected Apply Simulation Summary"
            echo ""
            echo "| Parameter | Value |"
            echo "| :--- | :--- |"
            echo "| **Plan Identifier** | \`${PLAN_ID}\` |"
            echo "| **Target Environment** | \`${TARGET_ENV}\` |"
            echo "| **State Lineage** | \`${TARGET_LINEAGE}\` |"
            echo "| **State Serial** | \`${TARGET_SERIAL}\` |"
            echo "| **Plan SHA-256 Digest** | \`${PLAN_DIGEST:-none}\` |"
            echo "| **Envelope Verification** | \`${PLAN_VERIFY_STATUS:-failure}\` |"
            echo "| **Provenance Attestation** | \`${PROV_STATUS:-unverified}\` |"
            echo "| **State Consistency** | \`${STATE_STATUS:-failure}\` |"
            echo "| **Replay Ledger Reservation** | \`${REPLAY_STATUS:-failed}\` |"
            echo "| **Destruction Assessment** | \`${DESTRUCT_STATUS:-not-applicable}\` |"
            echo "| **Destruction Metrics** | \`${DESTRUCT_SUMMARY:-{}}\` |"
            echo "| **Execution Mode** | \`simulated-only\` (No infrastructure changes) |"
            echo "| **Final Authorization Decision** | **\`${FINAL_AUTH}\`** |"
            echo ""
            if [[ "${FINAL_AUTH}" == "AUTHORIZED_FOR_SIMULATION" ]]; then
              echo "### ✅ Plan Authorized for Simulation"
              echo "The Terraform execution plan successfully satisfied all pre-execution cryptographic integrity, expiration, state consistency, replay reservation, and blast-radius destruction checks."
              echo ""
              echo "> [!NOTE]"
              echo "> This workflow executes in simulation-only mode ($0.00 cloud spend, zero cloud credentials). No state-modifying execution (application or destruction) occurred."
            else
              echo "### ❌ Pre-Execution Authorization Rejected"
              echo "The plan failed one or more mandatory security gates. Infrastructure execution is strictly blocked."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Ensure fail-closed workflow exit
          if [[ "${FINAL_AUTH}" != "AUTHORIZED_FOR_SIMULATION" ]]; then
            echo "::error::Protected apply simulation failed authorization gate."
            exit 1
          fi
