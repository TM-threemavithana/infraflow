name: "InfraFlow CI"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows:
    name: "Lint & Audit GitHub Actions Workflows"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: "Install & Run actionlint (SHA256 Verified)"
        run: |
          set -euo pipefail
          echo "::group::Downloading and verifying actionlint release"
          ACTIONLINT_VER="1.7.7"
          EXPECTED_SHA="023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"

          curl -sSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VER}/actionlint_${ACTIONLINT_VER}_linux_amd64.tar.gz"
          echo "${EXPECTED_SHA}  actionlint.tar.gz" | sha256sum -c -

          tar -xzf actionlint.tar.gz actionlint
          chmod +x ./actionlint
          echo "::endgroup::"

          echo "::group::Executing actionlint"
          ./actionlint -color
          echo "::endgroup::"

      - name: "Install & Run zizmor (SHA256 Verified)"
        run: |
          set -euo pipefail
          echo "::group::Downloading and verifying zizmor release"
          ZIZMOR_VER="1.32.0"
          ZIZMOR_SHA="bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b"

          curl -sSL -o zizmor.tar.gz "https://github.com/woodruffw/zizmor/releases/download/v${ZIZMOR_VER}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA}  zizmor.tar.gz" | sha256sum -c -

          tar -xzf zizmor.tar.gz zizmor
          chmod +x ./zizmor
          echo "::endgroup::"

          echo "::group::Executing zizmor"
          ./zizmor -c .zizmor.yml --min-severity medium .github/workflows
          echo "::endgroup::"

  security-cloud-free-example:
    name: "Self-Test Reusable Security (Cloud-Free Example)"
    uses: ./.github/workflows/reusable-tf-security.yml
    with:
      terraform-version: "1.10.4"
      working-directory: "examples/cloud-free-module"
      policy-directory: "policies"
      enable-tflint: true
      enable-trivy: true
      enable-conftest: true
      enable-zizmor: false

  validate-cloud-free-example:
    name: "Self-Test Reusable Core (Cloud-Free Example)"
    uses: ./.github/workflows/reusable-tf-validate.yml
    with:
      terraform-version: "1.10.4"
      working-directory: "examples/cloud-free-module"
      enable-fmt-check: true
      enable-validate: true
      enable-test: true

  operational-maturity-verification:
    name: "Operational Maturity & Fleet Governance (Cloud-Free)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout Platform Repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: "Setup Python Environment"
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: "Install Core Python Dependencies"
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml

      - name: "Checkout Consumer Fleet: Networking (AWS)"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: "TM-threemavithana/infraflow-consumer-networking"
          path: "fleet/infraflow-consumer-networking"
          persist-credentials: false

      - name: "Checkout Consumer Fleet: Application (Azure)"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: "TM-threemavithana/infraflow-consumer-application"
          path: "fleet/infraflow-consumer-application"
          persist-credentials: false

      - name: "Checkout Consumer Fleet: Data Platform (GCP)"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: "TM-threemavithana/infraflow-consumer-data-platform"
          path: "fleet/infraflow-consumer-data-platform"
          persist-credentials: false

      - name: "Execute Central Fleet Compliance Evaluation"
        run: |
          mkdir -p reports
          python3 scripts/generate-compliance-dashboard.py \
            --manifest config/fleet-manifest.yaml \
            --fleet-root fleet \
            --enforce-threshold 90.0 \
            --output-json reports/compliance-dashboard.json \
            --output-markdown reports/FLEET-COMPLIANCE-DASHBOARD.md \
            --output-html reports/compliance-dashboard.html

      - name: "Execute Speculative Drift Detection Simulation"
        run: |
          mkdir -p reports/drift
          python3 scripts/simulate-drift.py \
            --expected fixtures/drift/aws/clean/expected.json \
            --observed fixtures/drift/aws/clean/observed.json \
            --repository TM-threemavithana/infraflow-consumer-networking \
            --workspace prod \
            --provider aws \
            --output-json reports/drift/consumer-networking.json \
            --enforce-zero-drift

      - name: "Execute Upgrade Campaign Verification"
        run: |
          python3 scripts/orchestrate-campaign.py \
            --create \
            --target-sha "${GITHUB_SHA}" \
            --manifest config/fleet-manifest.yaml \
            --fleet-root fleet \
            --campaign-file reports/active-upgrade-campaign.json

      - name: "Execute Unified Operational Maturity Verification"
        run: |
          python3 scripts/verify-operational-maturity.py \
            --manifest config/fleet-manifest.yaml \
            --fleet-root fleet \
            --campaign-file reports/active-upgrade-campaign.json \
            --enforce-threshold 90.0 \
            --output-json reports/operational-maturity-report.json \
            --output-markdown reports/OPERATIONAL-MATURITY-SUMMARY.md

      - name: "Upload Operational Governance Artifacts"
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: "infraflow-operational-maturity-evidence"
          path: |
            reports/compliance-dashboard.json
            reports/compliance-dashboard.html
            reports/active-upgrade-campaign.json
            reports/operational-maturity-report.json
            reports/OPERATIONAL-MATURITY-SUMMARY.md
          if-no-files-found: warn
          retention-days: 30
