name: "InfraFlow Fleet Observability & Compliance Pipeline"

on:
  schedule:
    # Run weekly on Mondays at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      enforce-threshold:
        description: "Minimum fleet compliance score percentage (0-100)"
        required: false
        default: "80.0"
        type: string
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/fleet-observability.yml"
      - "scripts/**"
      - "config/fleet-manifest.yaml"
      - "fixtures/drift/**"

permissions:
  contents: read

concurrency:
  group: "fleet-observability-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  fleet-compliance:
    name: "Fleet Observability & Compliance Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Checkout Platform Repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: "Setup Python Environment"
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: "Install Core Python Dependencies"
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml

      - name: "Checkout Consumer Fleet: Networking (AWS)"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: "TM-threemavithana/infraflow-consumer-networking"
          path: "fleet/infraflow-consumer-networking"
          persist-credentials: false

      - name: "Checkout Consumer Fleet: Application (Azure)"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: "TM-threemavithana/infraflow-consumer-application"
          path: "fleet/infraflow-consumer-application"
          persist-credentials: false

      - name: "Checkout Consumer Fleet: Data Platform (GCP)"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: "TM-threemavithana/infraflow-consumer-data-platform"
          path: "fleet/infraflow-consumer-data-platform"
          persist-credentials: false

      - name: "Audit Fleet Drift & Manifest Alignment"
        id: drift_check
        run: |
          echo "Executing central fleet drift check..."
          python3 scripts/plan-fleet-upgrade.py --manifest config/fleet-manifest.yaml --check-drift

      - name: "Generate Central Fleet Compliance Dashboard"
        id: generate_dashboard
        env:
          INPUT_THRESHOLD: "${{ inputs.enforce-threshold || '80.0' }}"
        run: |
          mkdir -p reports docs/reports
          python3 scripts/generate-compliance-dashboard.py \
            --manifest config/fleet-manifest.yaml \
            --fleet-root fleet \
            --output-json reports/compliance-dashboard.json \
            --output-markdown docs/reports/FLEET-COMPLIANCE-DASHBOARD.md \
            --output-html reports/compliance-dashboard.html \
            --enforce-threshold "${INPUT_THRESHOLD}"

      - name: "Verify Enterprise Operational Maturity"
        id: verify_maturity
        env:
          INPUT_THRESHOLD: "${{ inputs.enforce-threshold || '80.0' }}"
        run: |
          python3 scripts/verify-operational-maturity.py \
            --manifest config/fleet-manifest.yaml \
            --fleet-root fleet \
            --enforce-threshold "${INPUT_THRESHOLD}" \
            --output-json reports/operational-maturity-report.json \
            --output-markdown reports/OPERATIONAL-MATURITY-SUMMARY.md

      - name: "Emit Structured Fleet Observability Telemetry"
        if: always()
        env:
          JOB_STATUS: "${{ job.status }}"
        run: |
          STATUS="PASS"
          if [[ "${JOB_STATUS}" != "success" ]]; then
            STATUS="FAIL"
          fi

          python3 scripts/emit-telemetry.py \
            --event-type fleet_audit_completed \
            --consumer-id platform-central \
            --repository "${GITHUB_REPOSITORY}" \
            --status "${STATUS}" \
            --adapter generic \
            --platform-sha "${GITHUB_SHA}" \
            --output reports/fleet-observability-telemetry.json

      - name: "Publish Fleet Compliance Summary to GitHub Step Summary"
        if: always()
        run: |
          if [[ -f docs/reports/FLEET-COMPLIANCE-DASHBOARD.md ]]; then
            cat docs/reports/FLEET-COMPLIANCE-DASHBOARD.md >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [[ -f reports/OPERATIONAL-MATURITY-SUMMARY.md ]]; then
            echo "" >> "${GITHUB_STEP_SUMMARY}"
            cat reports/OPERATIONAL-MATURITY-SUMMARY.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: "Upload Compliance Dashboard Artifacts"
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb99736d90 # v4.6.1
        with:
          name: "infraflow-fleet-compliance-reports"
          path: |
            reports/compliance-dashboard.json
            reports/compliance-dashboard.html
            reports/fleet-observability-telemetry.json
            reports/operational-maturity-report.json
            reports/OPERATIONAL-MATURITY-SUMMARY.md
          if-no-files-found: warn
          retention-days: 30
