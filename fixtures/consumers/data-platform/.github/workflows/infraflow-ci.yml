name: "Data Platform CI"

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "infraflow.config.yaml"
      - ".github/workflows/infraflow-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gcp-speculative-plan:
    name: "GCP Speculative Plan (Cloud-Free)"
    uses: TM-threemavithana/infraflow/.github/workflows/reusable-tf-gcp.yml@2ce0ddd5de01530b6bf7aba749f0081620fb9b27 # v0.5.0
    with:
      terraform-version: "1.10.4"
      working-directory: "terraform"
      environment: "dev"
      gcs-bucket: "gcs-data-infraflow-tfstate"
      gcs-prefix: "env/dev"
      enable-gcp-auth: false
