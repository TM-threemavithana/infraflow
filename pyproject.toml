[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infraflow"
version = "0.8.0"
description = "Security-governed multi-cloud infrastructure delivery platform CLI and diagnostic engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "InfraFlow Platform Engineering Team" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=6.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "unittest-xml-reporting",
]

[project.scripts]
infraflow = "infraflow.cli:main"

[project.urls]
Homepage = "https://github.com/TM-threemavithana/infraflow"
Documentation = "https://github.com/TM-threemavithana/infraflow/tree/main/docs"
Repository = "https://github.com/TM-threemavithana/infraflow.git"

[tool.setuptools]
packages = ["infraflow"]

[tool.setuptools.package-data]
infraflow = ["py.typed"]
